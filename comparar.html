<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparar | CarZone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <header>
        <nav>
            <a href="index.html" class="logo">CarZone</a>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="carros.html">Carros</a></li>
                <li><a href="comparar.html">Comparar</a></li>
                <li><a href="categorias.html">Categorias</a></li>
                <li><a href="sobre.html">Sobre</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="comparar-hero">
            <div class="comparar-conteudo">
                <p>FERRAMENTA</p>
                <h1>Compare Carros</h1>

                <p class="descricao-destaque">
                    Escolha dois veículos e analise lado a lado suas principais especificações e desempenho.
                </p>

                <div class="comparar-card-box">
                    <div class="selecao-carros">
                        <div class="select-group">
                            <label for="carro1">Primeiro Veículo</label>
                            <select id="carro1" class="select-custom">
                                <option value="">Selecione um carro</option>
                                <option value="bmw">BMW M2</option>
                                <option value="porsche">Porsche 911</option>
                                <option value="haval">GWM Haval H6</option>
                                <option value="byd">BYD Song Plus</option>
                            </select>
                        </div>

                        <div class="vs-divider">
                            <span>VS</span>
                        </div>

                        <div class="select-group">
                            <label for="carro2">Segundo Veículo</label>
                            <select id="carro2" class="select-custom">
                                <option value="">Selecione um carro</option>
                                <option value="bmw">BMW M2</option>
                                <option value="porsche">Porsche 911</option>
                                <option value="haval">GWM Haval H6</option>
                                <option value="byd">BYD Song Plus</option>
                            </select>
                        </div>
                    </div>

                    <button class="btn-comparar" onclick="compararCarros()">
                        Comparar Veículos
                    </button>
                </div>

                <div id="resultado-comparacao">
                    <!-- O JavaScript vai inserir o resultado do comparativo aqui -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CarZone. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
